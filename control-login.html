<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Savage Admin Login</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#000;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
color:white;

}

.login-box{

width:90%;
max-width:420px;
background:#111;
padding:35px;
border-radius:15px;
border:1px solid #333;
box-shadow:0 0 25px rgba(255,0,0,.25);

}

.logo{

display:block;
margin:0 auto 20px;
width:110px;

}

h1{

font-family:'Oswald',sans-serif;
text-align:center;
letter-spacing:3px;
margin-bottom:10px;

}

p{

text-align:center;
color:#aaa;
margin-bottom:25px;

}

input{

width:100%;
padding:14px;
margin-bottom:20px;
border:none;
border-radius:8px;
font-size:16px;

}

button{

width:100%;
padding:15px;
background:red;
border:none;
color:white;
font-size:17px;
cursor:pointer;
border-radius:8px;
font-weight:bold;

}

button:hover{

background:#cc0000;

}

#error{

margin-top:18px;
text-align:center;
color:#ff4d4d;
font-weight:bold;

}

</style>

</head>

<body>

<div class="login-box">

<img src="logo.png" class="logo">

<h1>SAVAGE ADMIN</h1>

<p>Control Panel Login</p>

<input
type="password"
id="password"
placeholder="Enter Password"
>

<button onclick="login()">
<label style="display:flex;align-items:center;gap:8px;margin-bottom:20px;cursor:pointer;">

<input
type="checkbox"
id="showPassword"
style="width:auto;"
>

Show Password

</label>
LOGIN

</button>

<p id="error"></p>

<script>

const passwordInput =
document.getElementById("password");

document
.getElementById("showPassword")
.addEventListener("change",function(){

passwordInput.type=
this.checked?"text":"password";

});

passwordInput.addEventListener("keypress",function(e){

if(e.key==="Enter"){

login();

}

});

function login(){

const password=
passwordInput.value;

const error=
document.getElementById("error");

if(password==="LATOYA"){

error.style.color="#00ff99";

error.innerHTML="✅ Access Granted...";

setTimeout(function(){

window.location.href="control.html";

},800);

}

else{

error.style.color="#ff4d4d";

error.innerHTML="❌ Incorrect Password";

passwordInput.value="";

passwordInput.focus();

}

}

</script>

</div>

</body>

</html>
