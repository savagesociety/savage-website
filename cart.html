<!DOCTYPE html>

<html>

<head>

<title>SAVAGE CART</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&display=swap" rel="stylesheet">


<style>

/* BODY */

body{

margin:0;

background:black;

color:white;

font-family:Arial;

}


/* HEADER */

header{

background:black;

display:flex;

justify-content:space-between;

align-items:center;

padding:20px 55px;

border-bottom:2px solid white;

}


/* LOGO */

.logo{

height:85px;

}


/* NAV */

nav a{

color:white;

text-decoration:none;

margin-left:30px;

letter-spacing:1px;

}


nav a:hover{

color:red;

}


/* CART TITLE */

.cart-title{

font-family:'Oswald';

letter-spacing:4px;

font-size:35px;

text-align:center;

margin-top:40px;

}


/* CART CONTAINER */

.cart-container{

padding:40px 80px;

}


/* CART ITEM */

.cart-item{

display:flex;

align-items:center;

justify-content:space-between;

background:#111;

margin-bottom:25px;

padding:20px;

}


/* PRODUCT IMAGE */

.cart-item img{

width:120px;

}


/* REMOVE BUTTON */

.remove-btn{

background:red;

border:none;

color:white;

padding:8px 15px;

cursor:pointer;

}


.remove-btn:hover{

background:black;

border:2px solid white;

}


/* TOTAL */

.total{

text-align:center;

font-size:28px;

margin-top:30px;

font-family:'Oswald';

}


/* CHECKOUT BUTTON */

.checkout-btn{

display:block;

margin:40px auto;

padding:15px 50px;

font-size:18px;

background:red;

color:white;

border:none;

cursor:pointer;

letter-spacing:2px;

}


.checkout-btn:hover{

background:black;

border:2px solid white;

}
.quantity-controls{

display:flex;

align-items:center;

gap:12px;

margin-top:12px;

}

.quantity-controls button{

width:32px;

height:32px;

background:red;

color:white;

border:none;

cursor:pointer;

font-size:18px;

font-weight:bold;

}

.quantity-controls span{

font-weight:bold;

min-width:20px;

text-align:center;

}
.empty-cart{

text-align:center;

padding:60px 20px;

}

.empty-cart h2{

font-family:'Oswald';

letter-spacing:2px;

margin-bottom:20px;

}

.empty-cart p{

color:#ccc;

margin-bottom:30px;

}

.continue-btn{

display:inline-block;

padding:15px 35px;

background:red;

color:white;

text-decoration:none;

font-weight:bold;

letter-spacing:1px;

}

.continue-btn:hover{

background:black;

border:2px solid white;

}
</style>

</head>



<body>
<script>

if(

localStorage.getItem("websiteLocked")==="true"

&&

localStorage.getItem("adminBypass")!=="true"

){

window.location.href="locked.html";

}

</script>


<header>

<img src="savage-logo.png" class="logo">


<nav>

<a href="index.html">HOME</a>

<a href="shop.html">SHOP</a>

<a href="checkout.html">CHECKOUT</a>

</nav>


</header>



<div class="cart-title" id="cart-title">

YOUR CART (0 ITEMS)

</div>


<div class="cart-container" id="cart-container">

</div>



<div class="total" id="total-price">

TOTAL: ₦0

</div>



<button class="checkout-btn" onclick="goToCheckout()">

PROCEED TO CHECKOUT
<button class="checkout-btn" id="clearCartBtn" onclick="clearCart()">

CLEAR CART

</button>
</button>



<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

let container = document.getElementById("cart-container");

let total = 0;

const exchangeRate =
parseFloat(
localStorage.getItem("exchangeRate")
) || 1600;

let currentCurrency = localStorage.getItem("currency") || "NGN";

function formatPrice(price){

if(currentCurrency==="USD"){

return "$"+(price/exchangeRate).toFixed(2);

}

return "₦"+price.toLocaleString();

}

function changeQuantity(index,amount){

if(!cart[index].quantity){

cart[index].quantity=1;

}

cart[index].quantity+=amount;

if(cart[index].quantity<1){

cart[index].quantity=1;

}

localStorage.setItem("cart",JSON.stringify(cart));

renderCart();

}
function renderCart(){

container.innerHTML="";
total = 0;
if(cart.length===0){

container.innerHTML=`

<div class="empty-cart">

<h2>Your cart is empty</h2>

<p>Add something from the Savage collection.</p>

<a href="shop.html" class="continue-btn">

CONTINUE SHOPPING

</a>

</div>

`;

document.getElementById("total-price").innerHTML="TOTAL: "+formatPrice(0);

document.getElementById("cart-title").innerHTML="YOUR CART (EMPTY)";

return;

}
cart.forEach((item,index)=>{

const quantity=item.quantity||1;

total+=item.price*quantity;

container.innerHTML += `

<div class="cart-item">

<img src="${item.image}">

<div>

<h3>${item.name}</h3>

<p>Size: ${item.size}</p>

<p>${formatPrice(item.price)}</p>

<div class="quantity-controls">

<button onclick="changeQuantity(${index},-1)">−</button>

<span>${item.quantity || 1}</span>

<button onclick="changeQuantity(${index},1)">+</button>

</div>

</div>

<button class="remove-btn" onclick="removeItem(${index})">

REMOVE

</button>

</div>

`;

});

let itemCount=0;

cart.forEach(item=>{

itemCount+=item.quantity||1;

});

document.getElementById("cart-title").innerHTML=

itemCount===0

?

"YOUR CART (EMPTY)"

:

`YOUR CART (${itemCount} ITEMS)`;
document.getElementById("total-price").innerText =

"TOTAL: " + formatPrice(total);

}


function removeItem(index){

cart.splice(index,1);

localStorage.setItem("cart",JSON.stringify(cart));

location.reload();

}

function clearCart(){

if(confirm("Are you sure you want to clear your cart?")){

cart=[];

localStorage.setItem("cart",JSON.stringify(cart));

renderCart();

}

}
function goToCheckout(){

window.location.href="checkout.html";

}


renderCart();

</script>



</body>

</html>
