<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Savage Society</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
font-family:'Montserrat',sans-serif;
overflow:hidden;
}

/* INTRO VIDEO */

#intro{
position:fixed;
top:0;
left:0;
width:100%;
height:100vh;
background:black;
z-index:10;
}

#intro video{
width:100%;
height:100%;
object-fit:cover;
}

/* LOGO SCREEN */

#home{
position:fixed;
top:0;
left:0;
width:100%;
height:100vh;
background:black;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

opacity:0;
transition:1.2s;
}

.logo{
width:280px;
max-width:70%;
animation:pulse 3s infinite;
}

@keyframes pulse{

0%{transform:scale(1);}
50%{transform:scale(1.03);}
100%{transform:scale(1);}

}

#shopBtn{

margin-top:50px;

padding:18px 55px;

background:red;

color:white;

text-decoration:none;

font-size:18px;

font-weight:bold;

border-radius:40px;

opacity:0;

transform:translateY(30px);

transition:0.8s;

}

#shopBtn:hover{

background:#c40000;

transform:translateY(25px) scale(1.05);

}

</style>

</head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<body>
  <script>

(function(){

    const today = new Date().toDateString();

    let analytics = JSON.parse(localStorage.getItem("websiteAnalytics")) || {};

    if(analytics.lastVisit !== today){

        analytics.lastVisit = today;

        analytics.total = (analytics.total || 0) + 1;
        analytics.today = (analytics.today || 0) + 1;
        analytics.week = (analytics.week || 0) + 1;
        analytics.month = (analytics.month || 0) + 1;
        analytics.year = (analytics.year || 0) + 1;

        localStorage.setItem(
            "websiteAnalytics",
            JSON.stringify(analytics)
        );

    }

})();

</script>  
<script>
console.log("LOCK CHECK");
console.log(localStorage.getItem("websiteLocked"));

if (localStorage.getItem("websiteLocked") == "true") {
    console.log("REDIRECTING...");
    window.location.replace("locked.html");
}
</script>

</script>
<div id="intro">

<video id="introVideo" autoplay muted playsinline>

<source src="intro.mp4" type="video/mp4">

</video>

</div>

<div id="home">

<img src="logo.png" class="logo">

<a href="shop.html" id="shopBtn">

GO TO SHOP

</a>

</div>

<script>

const video=document.getElementById("introVideo");

const intro=document.getElementById("intro");

const home=document.getElementById("home");

const btn=document.getElementById("shopBtn");

video.onended=function(){

intro.style.display="none";

home.style.opacity="1";

setTimeout(function(){

btn.style.opacity="1";

btn.style.transform="translateY(0px)";

},800);

}

</script>
<script>

let currentProduct={};

let currentFront="";
let currentBack="";

function openProduct(name,price,image,hasBack,colorOption){

currentProduct={
name:name,
price:price,
image:image
};

document.getElementById("popupName").innerHTML=name;

document.getElementById("popupPrice").innerHTML=
"₦"+price.toLocaleString();

document.getElementById("popupImage").src=image;

document.getElementById("productModal").style.display="flex";

if(colorOption){

document.getElementById("colorSection").style.display="block";

}else{

document.getElementById("colorSection").style.display="none";

}

if(hasBack){

document.getElementById("imageSwitcher").style.display="flex";

currentFront=image;

if(image==="blackpolo.png"){

currentBack="blackpoloback.png";

}

else if(image==="whitepolo.png"){

currentBack="whitepoloback.png";

}

}else{

document.getElementById("imageSwitcher").style.display="none";

}

}

function closeModal(){

document.getElementById("productModal").style.display="none";

}

function showFront(){

document.getElementById("popupImage").src=currentFront;

}

function showBack(){

document.getElementById("popupImage").src=currentBack;

}

window.onclick=function(event){

const modal=document.getElementById("productModal");

if(event.target===modal){

closeModal();

}

};

document.getElementById("popupCartBtn").onclick=function(){

let cart=JSON.parse(localStorage.getItem("cart"))||[];

cart.push({

name:currentProduct.name,

price:currentProduct.price,

image:currentProduct.image,

size:document.getElementById("popupSize").value,

color:document.getElementById("colorSection").style.display==="block"

?document.getElementById("popupColor").value

:""

});

localStorage.setItem("cart",JSON.stringify(cart));

alert("Added to Cart ✅");

closeModal();

};

</script>
